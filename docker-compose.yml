version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hidroponico_db
    environment:
      POSTGRES_DB: ${DB_NAME:-hidroponico}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT_HOST:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hidroponico}"]
      interval: 5s
      timeout: 5s
      retries: 5

  python:
    build: .
    container_name: hidroponico_python
    volumes:
      - .:/app
      - ./JSON.json:/app/JSON.json
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hidroponico}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command: tail -f /dev/null

  backend:
    build: .
    container_name: hidroponico_backend
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hidroponico}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
